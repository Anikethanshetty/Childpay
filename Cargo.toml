[package]
name = "kids-wallet-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.88"
chrono = { version = "0.4.41", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-async-std-native-tls", "postgres", "chrono", "uuid","bigdecimal"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
axum = "0.8.4"
axum-extra = { version = "0.12.5", features = ["cookie"]}
tokio = { version = "1.46.1", features = ["full"] }
tower = "0.5.2"
time = "0.3.41"
tower-http = { version = "0.6.6", features = ["cors","trace"] }
tracing-subscriber = { version = "0.3.19"}
lettre = "0.11.17"
regex = "1.11.1"
bigdecimal = {version = "0.4.3", features = ["serde"]}
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
once_cell = "1.21.4"
aws-sdk-s3 = {version = "1.131.0", features = ["rt-tokio"]}
aws-config = {version = "1.8.16", features = ["behavior-version-latest"]}
qrcode = "0.14.1"
base64 = "0.22.1"
image = "0.25.10"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
aws-types = "1.3.15"
